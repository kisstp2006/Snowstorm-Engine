name: lint

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin the clang-format major so CI matches local formatting (version drift between
      # clang-format releases changes output and would cause spurious failures). Installed from
      # the LLVM apt repo (no Python/pip); use the same 22.x locally.
      - name: Install clang-format 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-22
          sudo ln -sf /usr/bin/clang-format-22 /usr/local/bin/clang-format
          clang-format --version

      # Format-on-touch policy: any C++ file changed by this push/PR must be fully
      # clang-format clean (whole file). The codebase formats gradually as files are touched.
      - name: Determine changed C++ files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1...HEAD"
            else
              range="$before...HEAD"
            fi
          fi
          files=$(git diff --name-only --diff-filter=ACMR $range -- '*.cpp' '*.hpp' '*.h' \
            | grep -vE 'imgui_impl_' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: clang-format check
        if: steps.changed.outputs.files != ''
        run: |
          echo "Checking changed files:"
          echo "${{ steps.changed.outputs.files }}"
          echo "${{ steps.changed.outputs.files }}" | xargs clang-format --dry-run --Werror
