name: build

on:
  push:
    branches: [ master ]
  pull_request:

# Cancel an in-flight run when new commits are pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout (with the vcpkg submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      # vcpkg builds every dependency from source, which is slow. Cache the installed tree
      # (manifest mode installs into build/vcpkg_installed) keyed on the manifest.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', '.gitmodules') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # The hosted runner image ships VS 2022, so use the v143 preset (the local default is VS 2026).
      - name: Configure (vcpkg manifest + CMake preset)
        run: cmake --preset vs2022

      - name: Build all targets
        run: cmake --build --preset vs2022-debug

      - name: Run tests
        run: ctest --preset vs2022-debug
